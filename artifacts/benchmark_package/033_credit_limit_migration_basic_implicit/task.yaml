task_id: 033_CREDIT_LIMIT_MIGRATION_BASIC_IMPLICIT

objective: >
  Derive the credit master data of the new ERP system from the sales order
  history of the legacy system and produce a file in the structure and
  format shown by the target example. The legacy system holds no credit
  limits at all; the order history is the only record they can be derived
  from. Only orders that were actually invoiced or completed count - an
  order still open or cancelled is disregarded - and only orders in euro,
  since the credit policy is run in one currency. Every order a customer
  placed is one record of the source dataset, while the target system
  expects one record per customer, so the order values of a customer have
  to be accumulated into a historical revenue first; deliver the customers
  in ascending order of their legacy customer number. The business partner
  number and the payment behaviour of a customer come from the central
  customer cross reference list, and a customer absent from that list is
  not migrated. The credit limit follows from the historical revenue in
  five classes: below 5.000 euro the limit is 1, from 5.000 to below
  10.000 it is 3.000, from 10.000 to below 25.000 it is 10.000, from
  25.000 to below 100.000 it is 50.000, and from 100.000 upwards it is
  100.000. The risk class follows from the payment behaviour together with
  that limit: a blocked customer is always C; a good payer with a limit of
  50.000 or 100.000 is AA and otherwise A; a poor payer with a limit of
  50.000 or 100.000 is B and otherwise C. A blocked customer additionally
  carries the credit block and the block reason Poor payment history. Risk
  classes B and C are marked as critical. The follow-up date is 31.03.2028
  for AA, 30.09.2027 for A, 31.03.2027 for B and 31.12.2026 for C. Every
  record belongs to credit segment 454 and its limit is valid without a
  restriction in time. No formal source or target schema is given - infer
  the required structure, the field mapping and the value formats yourself
  by comparing the input dataset against the target example.

input:
  source_dataset: data/dataset.csv
  target_example: data/target_example.csv
  reference_data:
    - name: customer_cross_reference
      file: data/mapping_list_customers.csv
      key_field: "customer no. legacy"
      value_field:
        - "customer no. new"
        - "payment behaviour"
      description: >
        Assigns the customer numbers of the legacy ERP system to the business
        partner numbers of the target ERP system and records, per customer,
        how it has paid in the past. A customer missing from this list is not
        managed in the target system and receives no credit master record.

business_rules: {}

output:
  format: csv

constraints:
  - Each output row shall represent one customer.
  - No additional columns beyond those shown in the target example may be added.
  - The column order must match the target example.
