table: credit_master_upload

entity: CreditAccount

description: >
  Target schema of the credit management upload container of the new ERP
  system. Each record carries the credit master data of exactly one business
  partner within one credit segment.

attributes:

  - name: PARTNER
    type: string
    required: true
    unique: true
    description: >
      Business partner number in the target ERP system.

  - name: CREDIT_SGMNT
    type: string
    required: true
    description: >
      Credit segment the limit is maintained in.

  - name: CREDIT_LIMIT
    type: string
    required: true
    allowed_values:
      - "1"
      - "3.000"
      - "10.000"
      - "50.000"
      - "100.000"
    description: >
      Credit limit granted to the partner. The new ERP system does not accept
      arbitrary amounts but only the five limit classes of the credit policy.

  - name: Risk Class
    type: string
    required: true
    allowed_values:
      - AA
      - A
      - B
      - C
    description: >
      Risk class of the partner. AA is the lowest risk, C the highest.

  - name: XBLOCKED
    type: string
    required: false
    allowed_values:
      - X
    description: >
      Credit block indicator. Set for partners whose deliveries are blocked,
      empty otherwise.

  - name: LIMIT_VALID_DATE
    type: date
    required: true
    format: MM/DD/YYYY
    description: >
      Date the credit limit is valid through.

  - name: XCRITICAL
    type: string
    required: false
    allowed_values:
      - X
    description: >
      Indicator marking the partner for monitoring by the credit department.

  - name: BLOCK_REASON
    type: string
    required: false
    description: >
      Reason the credit block was imposed. Filled only for blocked partners.

  - name: FOLLOW_UP_DT
    type: date
    required: true
    format: DD.MM.YYYY
    description: >
      Date the credit limit has to be reviewed again. The higher the risk, the
      sooner the review is due.

constraints:

  - id: CON-TGT-001
    description: PARTNER must be unique

  - id: CON-TGT-002
    description: >
      CREDIT_LIMIT must be one of the five limit classes of the credit policy

  - id: CON-TGT-003
    description: >
      BLOCK_REASON must be filled where XBLOCKED is set and empty where it is
      not

  - id: CON-TGT-004
    description: >
      XCRITICAL must be set for every partner in risk class B or C and empty
      for risk classes AA and A

  - id: CON-TGT-005
    description: >
      FOLLOW_UP_DT must not be later than LIMIT_VALID_DATE
