seed: 1009

locale: de_DE

columns:

  - column: journal no.
    strategy: unique_sequence
    format: "{:07d}"
    start: 7590000

  # Looked up in mapping_list_material.xlsx (8 empty values); kept as-is.
  - column: part no.
    strategy: numeric_mapping
    format: "00-{:06d}"
    min: 100000
    max: 999999
    

  # Paired with part no.; kept as-is so the pairing and the empty pattern
  # survive.
  - column: description 1
    strategy: part_name_mapping
    library_path: artifacts/part_name_library/part_name_library.csv

  # Excel exports this column as a datetime; the time part is 00:00:00 in
  # every one of the 100 rows and carries no information. It is kept as a
  # literal in field_format so the synthetic data reproduces the export
  # format exactly - a real quirk the agent under test has to cope with.
  - column: posting date
    strategy: date_distribution
    field_format: "YYYY-MM-DD 00:00:00"

  - column: movement code
    strategy: categorical_resample

  - column: unit
    strategy: categorical_resample

  - column: quantity
    strategy: numeric_distribution

  - column: value
    strategy: numeric_distribution

  # 29 distinct internal codes, 35 of 100 empty. Resampled within the
  # movement codes: whether a movement posts to a storage location at all
  # depends on its type (BWA never does, WE/WA/UMW/RF always do), and drawing
  # the column independently filled every row, leaving the "without a storage
  # location" rule with nothing to act on.
  - column: storage location
    strategy: numeric_mapping
    format: "{:04d}"
    min: 1000
    max: 9999

  # 80 of 100 values empty; kept as-is to preserve the empty pattern.
  - column: cost center
    strategy: numeric_mapping
    format: "0011/{:04d}"
    min: 1000
    max: 9999
