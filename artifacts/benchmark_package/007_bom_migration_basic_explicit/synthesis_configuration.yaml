seed: 1007

locale: de_DE

columns:

  # bom no. and component no. are looked up in mapping_list_materials.xlsx
  # (which also carries the descriptions), and 14 BOMs span 98 lines.
  # Everything structural is therefore kept as-is; only quantities and
  # units are synthesized.
  - column: bom no.
    strategy: numeric_mapping
    format: "{:08d}"
    min: 10000000
    max: 99999999

  - column: bom description
    strategy: part_name_mapping
    library_path: artifacts/part_name_library/part_name_library.csv

  - column: item no.
    strategy: identity

  - column: component no.
    strategy: numeric_mapping
    format: "{:08d}"
    min: 10000000
    max: 99999999

  - column: component description
    strategy: part_name_mapping
    library_path: artifacts/part_name_library/part_name_library.csv

  - column: component quantity
    strategy: numeric_distribution

  - column: length
    strategy: numeric_distribution

  - column: bom unit
    strategy: categorical_resample
