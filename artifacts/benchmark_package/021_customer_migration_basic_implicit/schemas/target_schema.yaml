table: customer_master

entity: Customer

description: >
  Structural schema definition for customer master data in a target ERP system.
  This schema defines only data structure, not data quality characteristics.

attributes:

  - name: CustomerID
    type: string
    required: true
    unique: true

  - name: Name
    type: string
    required: true

  - name: Street
    type: string
    required: false

  - name: City
    type: string
    required: false

  - name: PostalCode
    type: string
    required: false

  - name: Country
    type: string
    required: true
    format: ISO-3166 alpha-3

  - name: LastBusinessActivityDate
    type: date
    required: true

  - name: Status
    type: string
    required: true
    allowed_values:
      - active
      - inactive
