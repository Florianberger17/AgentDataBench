task_id: 024_PROJECT_MIGRATION_BASIC_IMPLICIT

objective: >
  Derive project definitions from the provided customer order dataset and
  produce a CSV file in the structure and format shown by the target
  example, with one row per customer order. The project definition is not
  contained in the source dataset: assign a consecutive number starting at
  P-310000. Every project receives the fixed project profile TS00007, the
  company code 0898, the factory calendar key 1, the planning profile
  ZR0001 and the network assignment 2.
  No formal source or target schema is given - infer the required structure, the field mapping and the value formats yourself by comparing the input dataset against the target example.

input:
  source_dataset: data/dataset.csv
  target_example: data/target_example.csv

business_rules: {}

output:
  format: csv

constraints:
  - Each output row shall represent one project definition.
  - No additional columns beyond those shown in the target example may be added.
  - The column order must match the target example.
