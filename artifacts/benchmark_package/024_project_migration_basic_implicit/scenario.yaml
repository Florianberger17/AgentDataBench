scenario_id: 024_PROJECT_MIGRATION_BASIC_IMPLICIT

name: ERP Project Migration

domain: ERP Data Integration

description: >
  Project data is migrated from a legacy ERP system to a new ERP system
  as part of a system modernization project. The source system stores project
  data records using the legacy data model, while the target ERP system
  requires the data in a different schema with standardized identifiers and
  attribute values.

business_objects:
  - Project

systems:
  source:
    name: Legacy ERP System
    description: >
      Stores project data using the legacy data model.

  target:
    name: Target ERP System
    description: >
      Stores project data using the target ERP data model
