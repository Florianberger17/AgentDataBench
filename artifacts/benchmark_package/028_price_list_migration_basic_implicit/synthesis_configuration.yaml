seed: 1008

locale: de_DE

columns:

  # Internal code (5303/9503) paired 1:1 with part no. in the source.
  # Resampling it independently produced duplicate (price list no., part no.)
  # combinations, which CON-TGT-001 forbids - kept as-is instead.
  - column: price list no.
    strategy: identity

  - column: item no.
    strategy: identity

  - column: part no.
    strategy: numeric_mapping
    format: "{:08d}"
    min: 10000000
    max: 99999999


  - column: description
    strategy: part_name_mapping
    library_path: artifacts/part_name_library/part_name_library.csv

  - column: quantity base
    strategy: categorical_resample

  - column: currency
    strategy: categorical_resample

  # "generally invalid" occurs once in the 100 source rows and the filtering
  # rule is written against it - without this guarantee a weighted redraw
  # loses it about as often as not, leaving the rule matching nothing.
  - column: validity
    strategy: categorical_resample
    ensure_all_values: true

  # Stored as a raw Excel serial (37681 = 2003-03-01), 63 of 100 empty.
  # Resampled within the validity groups: in the source a date is recorded
  # only for "valid from" records, and drawing the two columns independently
  # broke that agreement in 13 of 100 rows.
  - column: valid from date
    strategy: conditional_resample
    reference_column: validity

  - column: price
    strategy: numeric_distribution
