seed: 123

locale: de_DE

columns:

  - column: part no.
    strategy: unique_sequence
    format: "1000-{:04d}"
    start: 0

  - column: name
    strategy: part_name_replacement
    # Draws from artifacts/part_name_library/part_name_library.csv without
    # replacement (no duplicates); override with `library_path: <csv>` if needed.

  - column: unit
    strategy: categorical_resample

  - column: approval
    strategy: categorical_resample

  - column: part status
    strategy: categorical_resample

  - column: item type
    strategy: categorical_resample

  - column: spare part id
    strategy: categorical_resample

  - column: lead time
    strategy: numeric_distribution

  - column: creation date
    strategy: date_distribution
    field_format: "DD.MM.YY"

  - column: creator
    strategy: categorical_resample
    # provider: user_name
